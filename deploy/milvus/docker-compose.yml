# Milvus 嵌入式单机模式：内置 etcd + 本地文件存储，不依赖 MinIO
# 数据存放在 ~/milvus-deploy/volumes/milvus（项目目录外）
name: wingdesk-milvus

services:
  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.7
    command:
      - milvus
      - run
      - standalone
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    volumes:
      - ${HOME}/milvus-deploy/volumes/milvus:/var/lib/milvus
      - ./embedEtcd.yaml:/milvus/configs/embedEtcd.yaml
      - ./user.yaml:/milvus/configs/user.yaml
    ports:
      - "19530:19530"
      - "9091:9091"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f localhost:9091/healthz
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  attu:
    container_name: attu
    image: zilliz/attu:v2.5.7
    environment:
      MILVUS_URL: milvus-standalone:19530
    ports:
      - "8000:3000"
    depends_on:
      - milvus
    restart: unless-stopped
